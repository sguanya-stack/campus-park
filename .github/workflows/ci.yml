name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Smoke Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campuspark
          POSTGRES_PASSWORD: campuspark
          POSTGRES_DB: campuspark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campuspark"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://campuspark:campuspark@localhost:5432/campuspark_test
      NODE_ENV: test
      PORT: 3000
      LOG_LEVEL: warn

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push schema to test DB
        run: npx prisma db push --force-reset

      - name: Seed test database
        run: node prisma/seed.js

      # ── Syntax check: Node can parse all server-side JS files ─────────────
      - name: Syntax check (server.js)
        run: node --check server.js

      - name: Syntax check (app.js)
        run: node --check app.js

      # ── Smoke test: server starts and /api/spots returns 200 ──────────────
      - name: Start server (background)
        run: node server.js &
        env:
          DATABASE_URL: postgresql://campuspark:campuspark@localhost:5432/campuspark_test

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/spots && break
            echo "Waiting... ($i)"
            sleep 1
          done

      - name: Smoke — GET /api/spots returns 200
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/spots)
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Expected 200, got $STATUS" && exit 1)

      - name: Smoke — POST /api/auth/register works
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:3000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"name":"ci_smoke_user","password":"CIPass123!"}')
          echo "Register status: $STATUS"
          [ "$STATUS" = "201" ] || [ "$STATUS" = "409" ] || (echo "Unexpected: $STATUS" && exit 1)

      - name: Smoke — POST /api/auth/login returns token
        run: |
          RESP=$(curl -s -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"name":"ci_smoke_user","password":"CIPass123!"}')
          echo "Login response: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'token' in d, f'No token: {d}'"

      - name: Concurrency load test (race condition guard)
        run: node scripts/load-test-reserve.js
        env:
          DATABASE_URL: postgresql://campuspark:campuspark@localhost:5432/campuspark_test

  # ── Research harness + allocator service (Python) ─────────────────────
  # Runs with NO ANTHROPIC_API_KEY on purpose: every test here uses a stub
  # client, and conftest.py hard-blocks outbound sockets. A test that
  # started calling the real API would cost money on every push, so the
  # suite is built so it cannot.
  allocation-study:
    name: Allocation study — tests & reproducibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deliverables/llm-allocation-study

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Unit & integration tests
        run: python -m pytest tests/ -q

      - name: Reproducibility — identical seeds must give identical results
        run: |
          python -m harness.run_experiment --strategies greedy --loads 1.2 \
            --n-seeds 5 --target-capacity 240 --out-name _ci_a
          python -m harness.run_experiment --strategies greedy --loads 1.2 \
            --n-seeds 5 --target-capacity 240 --out-name _ci_b
          python - <<'PY'
          import csv
          # decision_latency_s is wall-clock and legitimately differs run to
          # run; everything else is a simulation output and must be identical.
          NONDETERMINISTIC = {"decision_latency_s"}
          def load(p):
              with open(p) as f:
                  return [{k: v for k, v in row.items() if k not in NONDETERMINISTIC}
                          for row in csv.DictReader(f)]
          a, b = load("results/_ci_a.csv"), load("results/_ci_b.csv")
          assert a and b, "no rows produced"
          diffs = [(i, x, y) for i, (x, y) in enumerate(zip(a, b)) if x != y]
          assert len(a) == len(b) and not diffs, (
              f"simulation is not reproducible across runs: {diffs[:2]}"
          )
          print(f"OK: {len(a)} episodes byte-identical across two independent runs")
          PY

      - name: Classical baselines produce zero illegal allocations
        run: |
          python -m harness.run_experiment --strategies random,fifo,greedy \
            --loads 0.8,2.0 --n-seeds 5 --target-capacity 240 --out-name _ci_legal
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("results/_ci_legal.csv")))
          bad = [r for r in rows if float(r["illegal_allocation_rate"]) > 0]
          assert not bad, f"classical policies must never allocate illegally: {bad[:3]}"
          print(f"OK: {len(rows)} episodes, zero illegal allocations")
          PY

      - name: Pre-registration — prompt fingerprints unchanged
        run: |
          python - <<'PY'
          import hashlib, json
          from harness.policies.llm_central import SYSTEM_PROMPT as T1
          from harness.policies.llm_negotiate import AGENT_SYSTEM_PROMPT, BROKER_SYSTEM_PROMPT
          from harness.policies.llm_common import ALLOCATION_TOOL
          from harness.policies.llm_negotiate import AGENT_BID_TOOL, BROKER_TENTATIVE_TOOL
          h = lambda s: hashlib.sha256(
              s.encode() if isinstance(s, str) else json.dumps(s, sort_keys=True).encode()
          ).hexdigest()[:16]
          expected = {
              "T1": "e3cfd6c8d2ae8db0", "agent": "f3b9fa5605da3716",
              "broker": "c3f7f5a542080738", "alloc": "cb7fed34d83e9002",
              "bid": "11ac97ec4cb16451", "tent": "2064efed20f1d535",
          }
          actual = dict(zip(expected, map(h, (
              T1, AGENT_SYSTEM_PROMPT, BROKER_SYSTEM_PROMPT,
              ALLOCATION_TOOL, AGENT_BID_TOOL, BROKER_TENTATIVE_TOOL))))
          drift = {k: (expected[k], actual[k]) for k in expected if expected[k] != actual[k]}
          assert not drift, (
              f"Prompt/schema changed after pre-registration: {drift}. "
              "If intentional, update PRE_REGISTRATION.md and re-freeze — "
              "results collected under the old prompts are no longer comparable."
          )
          print("OK: all 6 fingerprints match PRE_REGISTRATION.md")
          PY

      - name: Allocator service starts and degrades gracefully without an API key
        env:
          ALLOCATOR_POLICY: llm_negotiate
          PORT: 8081
        run: |
          python -m serving.app &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8081/metrics && break
            sleep 0.5
          done
          # No API key -> must serve Greedy, not 500
          RESP=$(curl -s -X POST http://localhost:8081/allocate \
            -H "Content-Type: application/json" \
            -d '[{"id":"r1","arrival_minute":10,"duration_minutes":60,"trip_value":30,"origin_lat":47.61385,"origin_lng":-122.20017}]')
          echo "$RESP"
          echo "$RESP" | python -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['policy'] == 'greedy', d
          assert len(d['assignments']) == 1, d
          print('OK: degraded to Greedy instead of failing')
          "

      - name: Clean up CI artifacts
        if: always()
        run: rm -f results/_ci_*.csv
