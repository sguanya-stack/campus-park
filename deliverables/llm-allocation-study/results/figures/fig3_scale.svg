<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="100%" role="img" aria-label="Scale validation dumbbell chart comparing success rate at two fleet sizes"><style>.fig{--surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#86857f; --grid:#e5e4e0; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --pos:#2a78d6; --neg:#d03b3b; --mid:#f0efec;}@media (prefers-color-scheme: dark){:root:where(:not([data-theme='light'])) .fig{--surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e86; --grid:#33332f; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#3987e5; --neg:#e66767; --mid:#383835;}}:root[data-theme='dark'] .fig{--surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e86; --grid:#33332f; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#3987e5; --neg:#e66767; --mid:#383835;}.fig{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif}.fig .ttl{fill:var(--ink);font-size:14px;font-weight:650}.fig .sub{fill:var(--ink2);font-size:11.5px}.fig .ax{fill:var(--ink2);font-size:11px}.fig .axs{fill:var(--ink3);font-size:10.5px}.fig .val{fill:var(--ink);font-size:10.5px;font-weight:600}.fig .vals{fill:var(--ink);font-size:9.5px;font-weight:600}.fig .grid{stroke:var(--grid);stroke-width:1}.fig .zero{stroke:var(--ink3);stroke-width:1.5}</style><rect width="760" height="416" fill="var(--surface)"/><text x="0" y="16" class="ttl">Scale validation: the shrink preserves the ordering</text><text x="0" y="34.0" class="sub">Success rate per arm and load at both fleet sizes. The LLM arms cannot be afforded at full size, so supply and demand</text><text x="0" y="50.0" class="sub">shrink together — verified here before relying on it. Ordering held in 6/6 (metric, ρ) cells; max mean deviation</text><text x="0" y="66.0" class="sub">0.052. It validates magnitude and ordering, NOT statistical precision (see Fig 4).</text><line x1="249.2" y1="102" x2="249.2" y2="372.0" class="grid"/><text x="249.2" y="94" class="axs"