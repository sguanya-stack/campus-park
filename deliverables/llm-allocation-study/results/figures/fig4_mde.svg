<svg class="fig" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="100%" role="img" aria-label="Minimum detectable effect by fleet size"><style>.fig{--surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --ink3:#86857f; --grid:#e5e4e0; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --pos:#2a78d6; --neg:#d03b3b; --mid:#f0efec;}@media (prefers-color-scheme: dark){:root:where(:not([data-theme='light'])) .fig{--surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e86; --grid:#33332f; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#3987e5; --neg:#e66767; --mid:#383835;}}:root[data-theme='dark'] .fig{--surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e86; --grid:#33332f; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --pos:#3987e5; --neg:#e66767; --mid:#383835;}.fig{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif}.fig .ttl{fill:var(--ink);font-size:14px;font-weight:650}.fig .sub{fill:var(--ink2);font-size:11.5px}.fig .ax{fill:var(--ink2);font-size:11px}.fig .axs{fill:var(--ink3);font-size:10.5px}.fig .val{fill:var(--ink);font-size:10.5px;font-weight:600}.fig .vals{fill:var(--ink);font-size:9.5px;font-weight:600}.fig .grid{stroke:var(--grid);stroke-width:1}.fig .zero{stroke:var(--ink3);stroke-width:1.5}</style><rect width="760" height="316" fill="var(--surface)"/><text x="0" y="16" class="ttl">What the shrink costs: detectable effect size</text><text x="0" y="34.0" class="sub">Minimum detectable difference in success rate (fifo vs greedy, ρ=1.2, n=30, α=0.05, power=0.80), measured from the</text><text x="0" y="50.0" class="sub">paired-difference SD. A correction to an earlier claim of mine: the scale validation in Fig 3 covers effect ordering,</text><text x="0" y="66.0" class="sub">not precision. At 30 spaces a real 2pp difference would be called “not significant” — a null result, not a negative</text><text x="0" y="82.0" class="sub">one.</text><line x1="0" y1="238.0" x2="700" y2="238.0" class="grid"/><text x="706" y="241.5" class="axs">0.0 pp</text><line x1="0" y1="198.7" x2="700" y2="198.7" class="grid"/><text x="706" y="202.2" class="axs">1.0 pp</text><line x1="0" y1="159.3" x2="700" y2="159.3" class="grid"/><text x="706" y="162.8" class="axs">2.0 pp</text><line x1="0" y1="120.0" x2="700" y2="120.0" class="grid"/><text x="706" y="123.5" class="axs">3.0 pp</text><path d="M18.0,238.0V124.0A4.0,4.0 0 0 1 22.0,120.0H211.3A4.0,4.0 0 0 1 215.3,124.0V238.0Z" fill="#86b6ef"><title>30 spaces: MDE 3.00 pp</title></path><text x="116.7" y="114.0" class="val" text-anchor="middle">3.00 pp</text><text x="116.7" y="254" class="ax" text-anchor="middle">30 spaces</text><path d="M251.3,238.0V196.5A4.0,4.0 0 0 1 255.3,192.5H444.7A4.0,4.0 0 0 1 448.7,196.5V238.0Z" fill="#5598e7"><title>240 spaces: MDE 1.16 pp</title></path><text x="350.0" y="186.5" class="val" text-anchor="middle">1.16 pp</text><text x="350.0" y="254" class="ax" text-anchor="middle">240 spaces</text><path d="M484.7,238.0V215.2A4.0,4.0 0 0 1 488.7,211.2H678.0A4.0,4.0 0 0 1 682.0,215.2V238.0Z" fill="#2a78d6"><title>833 spaces: MDE 0.68 pp</title></path><text x="583.3" y="205.2" class="val" text-anchor="middle">0.68 pp</text><text x="583.3" y="254" class="ax" text-anchor="middle">833 spaces</text><line x1="0" y1="238" x2="700" y2="238" class="zero"/><text x="0" y="276.0" class="axs">The frozen configuration uses 240 spaces at n=60, giving 0.65–1.07 pp. These come from deterministic policies, so they</text><text x="0" y="290.0" class="axs">are optimistic for the LLM arms, whose own jitter adds on top.</text></svg>